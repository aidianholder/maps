<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <div id="toolbar">
      <div class="tb-item">
        <button id="btn-layers" class="tb-btn" title="Layers">
          <img src="/ui/layers.svg" class="tb-icon" alt="Layers">
        </button>
        <div id="panel-layers" class="panel-dropdown"></div>
      </div>
      <div class="tb-item">
        <button id="btn-locators" class="tb-btn tb-btn-text" title="Labels">A</button>
        <div id="panel-locators" class="panel-dropdown"></div>
      </div>
      <div class="tb-item">
        <button id="btn-icons" class="tb-btn" title="Icons">
          <img src="/ui/Icone.svg" class="tb-icon" alt="Icons">
        </button>
        <div id="panel-icons" class="panel-dropdown"></div>
      </div>
    </div>
    <div id="draw-btn-wrapper">
      <button id="btn-draw" class="tb-btn tb-btn-text" title="Draw">✏</button>
      <div id="panel-draw" class="panel-dropdown"></div>
    </div>
    <div id="overlays-btn-wrapper">
      <button id="btn-overlays" class="tb-btn" title="Overlays">
        <img src="/ui/overlays.png" class="tb-icon" alt="Overlays">
      </button>
      <div id="panel-overlays" class="panel-dropdown"></div>
    </div>
    <div id="map-hud">
      <span><span class="hud-label">Coordinates</span><span id="hud-coords">—</span></span>
      <span><span class="hud-label">Zoom Level</span><span id="hud-zoom">—</span></span>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
